plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = "dev.krona"
version = project.version

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repositories {
    mavenCentral()
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

loom {
    def aw = file("src/main/resources/META-INF/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    // MIT requires the notice in "all copies", and for a mod the distributed copy is the jar,
    // not this repository. Loom's remapJar takes this jar as its input, so the file carries
    // through to the artifact that actually ships.
    from(rootProject.file('LICENSE'))
}

// Development tooling for the plan viewer (viewer/plan-viewer.html): dumps one CityPlan as JSON so
// it can be regenerated for a new seed/class without a full test run. Deliberately not wired into
// `build`, `jar` or `test` - registering the task lazily like this, and never adding it as a
// dependency of another task, keeps it out of the artifact that actually ships.
//
//   ./gradlew -q runPlanDump --args="1337 TOWN viewer/plan-1337-town.json"
//   ./gradlew -q runPlanDump --args="1337 CITY viewer/plan-1337-city.json river"
tasks.register('runPlanDump', JavaExec) {
    group = 'urbex'
    description = 'Dumps a CityPlan as JSON for viewer/plan-viewer.html. Dev tooling; excluded from build/jar.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.krona.urbex.plan.PlanJson'
}

processResources {
    def expandProps = [
            'version'              : version,
            'mod_id'               : mod_id,
            'mod_name'             : mod_name,
            'minecraft_version'    : minecraft_version,
            'fabric_loader_version': fabric_loader_version,
            'java_version'         : java_version
    ]
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifactId = "urbex"
        pom {
            name = 'Urbex'
            description = 'Procedural abandoned-city worldgen'
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}
