plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = "dev.krona"
version = project.version

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repositories {
    mavenCentral()
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

loom {
    def aw = file("src/main/resources/META-INF/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        digestCheck {
            server()
            setConfigName('Urbex Digest Check')
            ideConfigGenerated(false)
            runDir('runs/digestcheck')
            vmArg '-Durbex.digestCheck=3,rowmajor,100'
            // Single worker thread: parallel chunk generation is not yet run-to-run
            // deterministic (issue #24 - shared mutable ChunkHeightmap and friends), so the
            // regression pin is taken on a serial baseline. Lifting this flag - two parallel
            // runs agreeing - is the acceptance test for fixing #24.
            // Pinned DRIVERDIGEST for seed 1337; regenerate deliberately on world-changing
            // changes by deleting the file, running runDigestCheck twice (results must match)
            // and committing the new value.
            def golden = file('digest.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
        // A second, narrow sample, added because the primary sample above (radius 3, offset 100)
        // was confirmed to contain no bridgeable water on a primary line and no qualifying slope,
        // so it never moved when planned bridges and sloped minor roads were added and CI was
        // blind to both (see the hierarchical-streets Task 5 report). Widening the primary sample
        // to cover them was rejected - radius 15 there is ~20x the generation work of radius 3,
        // and it is the pin for everything else on this branch. This is a separate, disposable
        // window instead: freshly located on seed 1337 at offset 97, radius 12 (chunks 85..109 on
        // both axes), which contains BridgeSpan[orientation=X, fromX=86, fromZ=108, toX=90,
        // toZ=108] - the only mechanically-guarded evidence on this branch that a planned bridge
        // deck actually renders. A slope was also found nearby (93,116 - ZMAX), but including it
        // would need the same radius 15 that was rejected above, so it stays uncovered here.
        digestCheckBridge {
            server()
            setConfigName('Urbex Digest Check (bridge)')
            ideConfigGenerated(false)
            runDir('runs/digestcheckbridge')
            vmArg '-Durbex.digestCheck=12,rowmajor,97'
            // This window's only reason to exist is covering BridgeSpan[X, (86,108)->(90,108)] -
            // without that, it is an expensive duplicate of the primary sample above at ~13.8x the
            // generation work. requireBridge makes DigestRunner's own bridgeChunks count (printed on
            // every run, in DRIVERDIGEST's line) a hard gate here: zero planned-bridge chunks in the
            // sample fails the check instead of silently passing. Before accepting a *new*
            // digest-bridge.golden (moving code changed this window's output), confirm the window
            // still contains a planned bridge - `/urbex debug` around chunk (88, 108), or a `spanAt`
            // probe - and if it does not, relocate the window (a new offset/radius) rather than just
            // regenerating the hash: a passing check on a window with no bridge in it is exactly the
            // silent coverage loss this whole file exists to prevent.
            vmArg '-Durbex.digestCheck.requireBridge'
            def golden = file('digest-bridge.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
    }
}

// A fresh, fully pinned dedicated-server environment for every digest run: fixed seed, default
// (noise) world type, the 'default' urbex profile on the overworld, and no watchdog (the check
// generates its whole chunk square on the server thread). Shared by every digest run config, each
// against its own run directory so the two checks cannot clobber each other's world.
def registerPrepareDigestCheck = { String taskName, String runDirPath ->
    tasks.register(taskName) {
        notCompatibleWithConfigurationCache("writes the run directory")
        doLast {
            def dir = file(runDirPath)
            project.delete(new File(dir, 'world'))
            dir.mkdirs()
            new File(dir, 'eula.txt').text = 'eula=true\n'
            new File(dir, 'server.properties').text = '''\
level-seed=1337
online-mode=false
spawn-protection=0
view-distance=6
max-tick-time=-1
motd=urbex digest check
'''
            def cfgDir = new File(dir, 'world/serverconfig')
            cfgDir.mkdirs()
            new File(cfgDir, 'urbex.json').text = '{ "selectedProfile": "default" }\n'
        }
    }
}
registerPrepareDigestCheck('prepareDigestCheck', 'runs/digestcheck')
registerPrepareDigestCheck('prepareDigestCheckBridge', 'runs/digestcheckbridge')

tasks.matching { it.name == 'runDigestCheck' }.configureEach {
    dependsOn 'prepareDigestCheck'
}
tasks.matching { it.name == 'runDigestCheckBridge' }.configureEach {
    dependsOn 'prepareDigestCheckBridge'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    // MIT requires the notice in "all copies", and for a mod the distributed copy is the jar,
    // not this repository. Loom's remapJar takes this jar as its input, so the file carries
    // through to the artifact that actually ships.
    from(rootProject.file('LICENSE'))
}

processResources {
    def expandProps = [
            'version'              : version,
            'mod_id'               : mod_id,
            'mod_name'             : mod_name,
            'minecraft_version'    : minecraft_version,
            'fabric_loader_version': fabric_loader_version,
            'java_version'         : java_version
    ]
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifactId = "urbex"
        pom {
            name = 'Urbex'
            description = 'Procedural abandoned-city worldgen'
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}
