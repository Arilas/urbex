plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = "dev.krona"
version = project.version

base {
    // No Minecraft version here: `version` already starts with it (gradle.properties:
    // 26.2-0.1.0), and having both produced urbex-fabric-26.2-26.2-0.1.0.jar.
    archivesName = "${mod_id}-fabric"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repositories {
    mavenCentral()
}

loom {
    def aw = file("src/main/resources/META-INF/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        digestCheck {
            server()
            setConfigName('Urbex Digest Check')
            ideConfigGenerated(false)
            runDir('runs/digestcheck')
            vmArg '-Durbex.digestCheck=3,rowmajor,100'
            // Two Urbex cross-chunk terrain reads at the carver stage - where a chunk may touch
            // only itself - survived for months because nothing watched for them (see
            // UnsafeReadGateMixin, UnsafeReadCounter). This gate is not window-specific like
            // requireBridge/requireSlope below: any window should be free of Urbex cross-chunk
            // reads, so both digest runs set it.
            vmArg '-Durbex.digestCheck.failOnUnsafeRead'
            // This runs on the parallel path, deliberately. Generation used to be pinned to one
            // core here with -XX:ActiveProcessorCount=1, because a chunk's decoration step could
            // run before or after its neighbours' passes and output was not run-to-run
            // reproducible (issue #18). Moving city generation to the tail of applyCarvers fixed
            // that; 15dba5f2 removed the pin and ran #18's acceptance test - three parallel fresh
            // runs and one shuffled-order run all agreeing. So this check has been exercising
            // concurrent generation ever since, which is the point: a regression that only shows
            // up under worker scheduling has to be able to reach it.
            // Pinned DRIVERDIGEST for seed 1337; regenerate deliberately on world-changing
            // changes by deleting the file, running runDigestCheck twice (results must match)
            // and committing the new value.
            def golden = file('digest.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
        // A second, narrow sample, added because the primary sample above (radius 3, offset 100)
        // was confirmed to contain no bridgeable water on a primary line and no qualifying slope,
        // so it never moved when planned bridges and sloped minor roads were added and CI was
        // blind to both (see the hierarchical-streets Task 5 report). Widening the primary sample
        // to cover them was rejected - radius 15 there is ~20x the generation work of radius 3,
        // and it is the pin for everything else here. This is a separate, disposable
        // window instead: seed 1337, offset 83, radius 9 (chunks 74..92 on both axes), sized to be
        // the smallest square covering both known features. Relocated here (from offset 101,
        // radius 15) when the cross-chunk-access removal compacted Rng.Purpose by seven
        // dead constants, shifting every addressed stream and moving every city layout; the old
        // window's slope at (93,116) was gone and a wide probe (radius 40 around the old offset,
        // 6561 chunks) was needed to relocate both features. The bridge deck now sampled sits at
        // (87,92), (88,92), (89,92); the nearest slope found anywhere in that probe is at (74,87).
        // Both were re-probed and found at exactly those coordinates after the merge with the
        // sphere removal dropped three more dead constants (enum 44 -> 41), so the window itself
        // did not have to move again - only its golden.
        // At 361 chunks this costs 0.38x the 961-chunk window it replaces, and is still separate
        // from and disposable relative to the primary pin. requireBridge and requireSlope make
        // DigestRunner's own bridgeChunks/slopeChunks counts (printed on every run, in
        // DRIVERDIGEST's line) hard gates here: zero of either in the sample fails the check
        // instead of silently passing. Before accepting a *new* digest-features.golden (moving code
        // changed this window's output), confirm the window still contains both features -
        // `/urbex debug` around chunk (88, 92) for the bridge and (74, 87) for the slope, or a
        // `spanAt`/`getStreetSlopeDirection` probe - and if it does not, relocate the window (a new
        // offset/radius) rather than just regenerating the hash: a passing check on a window
        // missing either feature is exactly the silent coverage loss this whole file exists to
        // prevent.
        digestCheckFeatures {
            server()
            setConfigName('Urbex Digest Check (features)')
            ideConfigGenerated(false)
            runDir('runs/digestcheckfeatures')
            vmArg '-Durbex.digestCheck=9,rowmajor,83'
            vmArg '-Durbex.digestCheck.requireBridge'
            vmArg '-Durbex.digestCheck.requireSlope'
            // See the digestCheck block above: not window-specific, so both runs set it.
            vmArg '-Durbex.digestCheck.failOnUnsafeRead'
            def golden = file('digest-features.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
        // The same window as digestCheck, generated in a shuffled order and pinned to the same
        // golden. Order-independence is asserted here rather than assumed: the primary check has
        // always run one fixed order, so a decision that depends on which neighbours happen to be
        // loaded produces a stable hash there and is invisible. Issue #126 is exactly that -
        // hasBlacklistedStructure probes a 3x3 neighbourhood through level.hasChunk and treats
        // absent chunks as clear - so this exists to make the current behaviour observable before
        // it is changed, not after.
        //
        // It shares digestCheck's golden deliberately. A different value here would not mean
        // anything; equality with the row-major run is the whole assertion.
        digestCheckShuffled {
            server()
            setConfigName('Urbex Digest Check (shuffled order)')
            ideConfigGenerated(false)
            runDir('runs/digestcheckshuffled')
            vmArg '-Durbex.digestCheck=3,shuffled,100'
            vmArg '-Durbex.digestCheck.failOnUnsafeRead'
            def golden = file('digest.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
        // The window that covers structure avoidance at all. Neither of the two above does:
        // avoidedChunks is 0 in both, because seed 1337 has no village near either sample, so the
        // suppression branch never executed and a change to it could not move their goldens. This
        // seed spawns beside a plains village: 108 of the 625 sampled chunks carry a village
        // reference, and suppression demonstrably changes the world rather than only the counter -
        // with avoidVillages off the same window drives 654 chunks and 5804043 blocks instead of 580
        // and 5359701, so 74 chunks of city are actually removed here. requireAvoided gates it so a
        // window that stops containing a village fails instead of passing in silence - the same
        // guard requireBridge and requireSlope are for the features window.
        //
        // It is also the first window centred on the origin, and that is how it found the heightmap
        // sample-block overlap fixed in getHeightmap: rows x=0 and z=0 were claimed by two blocks at
        // once, so the height published for them depended on which chunk generated first. The
        // other three windows are sited entirely on positive chunks, where the old arithmetic and
        // floorDiv agree, which is why they were stable through it. The two hashes recorded here
        // before that fix - 995b19892c47e848 and 89d790a9182cff3f - were not a coin flip: each is
        // reproducible, selected by the worker thread count (1 and 16 give the first, 2 and 3 the
        // second). See the note on digestCheckAvoidShuffled for what now stands guard over it.
        digestCheckAvoid {
            server()
            setConfigName('Urbex Digest Check (structure avoidance)')
            ideConfigGenerated(false)
            runDir('runs/digestcheckavoid')
            vmArg '-Durbex.digestCheck=12,rowmajor,0'
            vmArg '-Durbex.digestCheck.requireAvoided'
            vmArg '-Durbex.digestCheck.failOnUnsafeRead'
            def golden = file('digest-avoid.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
        // The avoidance window in a shuffled generation order, pinned to the same golden, for the
        // same reason digestCheckShuffled shares digestCheck's: equality with the row-major run is
        // the whole assertion and a separate value here would mean nothing. It covers the request
        // order over a window that, unlike digestCheckShuffled's, contains both an avoided structure
        // and negative coordinates.
        //
        // Worth knowing what it is not: shuffling the request order did *not* expose the heightmap
        // overlap. Measured on the pre-fix build, this run and the row-major one both returned
        // 995b19892c47e848 - the race resolved the same way either way. digestCheckAvoidThreads
        // below is the one with teeth for that.
        digestCheckAvoidShuffled {
            server()
            setConfigName('Urbex Digest Check (structure avoidance, shuffled order)')
            ideConfigGenerated(false)
            runDir('runs/digestcheckavoidshuffled')
            vmArg '-Durbex.digestCheck=12,shuffled,0'
            vmArg '-Durbex.digestCheck.requireAvoided'
            vmArg '-Durbex.digestCheck.failOnUnsafeRead'
            def golden = file('digest-avoid.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
        // The same window again, row-major, on two worker threads instead of however many the host
        // has. This is the standing version of the experiment that found the heightmap sample-block
        // overlap, in the same way digestCheckShuffled is the standing version of the by-hand
        // order experiment noted above.
        //
        // Generation fans out to the worker pool, so a decision resolved by whichever thread got
        // there first produces one stable answer per pool size and looks perfectly reproducible
        // until the pool size changes. Pre-fix this window returned 995b19892c47e848 on 1 and 16
        // threads and 89d790a9182cff3f on 2 and 3 - each reproducible, neither a coin flip, and no
        // amount of rerunning on one machine would have shown it. Two threads is chosen because it
        // is the smallest count that still schedules concurrently, and because it is not the host's
        // - a guard that inherits the CI runner's core count asserts nothing about anyone else's.
        digestCheckAvoidThreads {
            server()
            setConfigName('Urbex Digest Check (structure avoidance, two workers)')
            ideConfigGenerated(false)
            runDir('runs/digestcheckavoidthreads')
            vmArg '-Durbex.digestCheck=12,rowmajor,0'
            vmArg '-Durbex.digestCheck.requireAvoided'
            vmArg '-Durbex.digestCheck.failOnUnsafeRead'
            vmArg '-Dmax.bg.threads=2'
            def golden = file('digest-avoid.golden')
            if (golden.exists()) {
                vmArg "-Durbex.digestCheck.expected=${golden.text.trim()}"
            }
        }
        // The weighted-world-style-mix census. Not a golden check and not run by CI: mixing needs a
        // second datapack registering a second world style, and this repository ships only its own.
        // Point it at one or more with `-PurbexMixPack=<jar>[,<jar>...]` and run `./gradlew runMixCheck`;
        // the jar is copied into the run's mods folder, which is where an Urbex asset pack goes.
        // Without a pack it still runs and reports the one built-in style, which is the useful
        // negative case: it proves the single-style path answers without ever drawing.
        mixCheck {
            server()
            setConfigName('Urbex World Style Mix Check')
            ideConfigGenerated(false)
            runDir('runs/mixcheck')
            // Radius 40 around the origin: large enough that a 1-in-10 style still lands several
            // cities in the sample at the default preset's city chance.
            vmArg '-Durbex.mixCheck=40'
            vmArg '-Durbex.mixCheck.requireAll'
        }
    }
}

// A fresh, fully pinned dedicated-server environment for every digest run: fixed seed, default
// (noise) world type, the 'urbex:default' preset on the overworld, and no watchdog. The watchdog
// is off because DigestRunner drives its whole chunk square from the server thread in one blocking
// loop, holding that thread far past max-tick-time; the generation itself still fans out to the
// worker pool, so this is not a serial baseline. Shared by every digest run config, each against
// its own run directory so the two checks cannot clobber each other's world.
def registerPrepareDigestCheck = { String taskName, String runDirPath, String extraConfig = '', String seed = '1337' ->
    tasks.register(taskName) {
        notCompatibleWithConfigurationCache("writes the run directory")
        doLast {
            def dir = file(runDirPath)
            project.delete(new File(dir, 'world'))
            dir.mkdirs()
            new File(dir, 'eula.txt').text = 'eula=true\n'
            new File(dir, 'server.properties').text = """\
level-seed=${seed}
online-mode=false
spawn-protection=0
view-distance=6
max-tick-time=-1
motd=urbex digest check
"""
            def cfgDir = new File(dir, 'world/serverconfig')
            cfgDir.mkdirs()
            new File(cfgDir, 'urbex.json').text = '{ "selectedPreset": "urbex:default"' + extraConfig + ' }\n'
        }
    }
}
registerPrepareDigestCheck('prepareDigestCheck', 'runs/digestcheck')
registerPrepareDigestCheck('prepareDigestCheckFeatures', 'runs/digestcheckfeatures')
registerPrepareDigestCheck('prepareDigestCheckShuffled', 'runs/digestcheckshuffled')
// A different seed from the other three, and the only place in this file that needs one: seed 1337
// has no village within radius 24 of either sample window (measured - 842 chunks with structure
// references, not one village), so avoidVillages - which is on by default and is the flag these two
// windows exist to cover - can never fire there. This seed spawns beside one. The config is the
// default one for the same reason: avoidVillages is what ships on, so it is what should be covered.
registerPrepareDigestCheck('prepareDigestCheckAvoid', 'runs/digestcheckavoid', '',
        '135132278163449878')
registerPrepareDigestCheck('prepareDigestCheckAvoidShuffled', 'runs/digestcheckavoidshuffled', '',
        '135132278163449878')
registerPrepareDigestCheck('prepareDigestCheckAvoidThreads', 'runs/digestcheckavoidthreads', '',
        '135132278163449878')

tasks.matching { it.name == 'runDigestCheck' }.configureEach {
    dependsOn 'prepareDigestCheck'
}
tasks.matching { it.name == 'runDigestCheckFeatures' }.configureEach {
    dependsOn 'prepareDigestCheckFeatures'
}
tasks.matching { it.name == 'runDigestCheckShuffled' }.configureEach {
    dependsOn 'prepareDigestCheckShuffled'
}
tasks.matching { it.name == 'runDigestCheckAvoid' }.configureEach {
    dependsOn 'prepareDigestCheckAvoid'
}
tasks.matching { it.name == 'runDigestCheckAvoidShuffled' }.configureEach {
    dependsOn 'prepareDigestCheckAvoidShuffled'
}
tasks.matching { it.name == 'runDigestCheckAvoidThreads' }.configureEach {
    dependsOn 'prepareDigestCheckAvoidThreads'
}

// The mix census needs a different world config from the digest runs - the experimental flag on,
// and a dimensionsWithPresets entry naming the weighted mix - plus whatever second datapack the
// caller supplied, dropped into the world's datapacks folder so its world style registers.
tasks.register('prepareMixCheck') {
    notCompatibleWithConfigurationCache("writes the run directory")
    doLast {
        def dir = file('runs/mixcheck')
        project.delete(new File(dir, 'world'))
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = '''\
level-seed=1337
online-mode=false
spawn-protection=0
view-distance=6
max-tick-time=-1
motd=urbex mix check
'''
        def packPath = project.findProperty('urbexMixPack')
        def styles = 'urbex:standard'
        // Cleared every run so a pack from a previous invocation cannot linger and silently keep
        // a world style registered after the caller stopped asking for it.
        def mods = new File(dir, 'mods')
        project.delete(mods)
        if (packPath) {
            // Comma-separated, so several packs can be mixed in one run - which is the case worth
            // checking, since a mix is only interesting once two packs have to coexist.
            def packs = packPath.split(',').collect { it.trim() }.findAll { it }.collect { file(it) }
            packs.each { pack ->
                if (!pack.exists()) {
                    throw new GradleException("urbexMixPack '${pack}' does not exist")
                }
            }
            // mods/, not world/datapacks/: an Urbex asset pack ships as a Fabric mod jar, and
            // Minecraft's datapack repository only accepts directories and .zip files, so a jar
            // dropped in world/datapacks is silently ignored.
            mods.mkdirs()
            project.copy {
                from packs
                into mods
            }
            def mixStyles = project.findProperty('urbexMixStyles')
                    ?: 'urbex:standard*0.1+urbexmt:moderntweaks*0.9'
            styles = mixStyles
            logger.lifecycle("mixCheck: ${packs*.name.join(', ')} -> mods/, styles ${styles}")
        } else {
            logger.lifecycle("mixCheck: no -PurbexMixPack given; running the single-style case")
        }
        // -PurbexMixExperimental=false runs the same mix against an install that never opted in,
        // which is the end-to-end proof of the gate: the census should report single=true on the
        // heaviest style alone.
        def experimental = project.findProperty('urbexMixExperimental') != 'false'
        def cfgDir = new File(dir, 'world/serverconfig')
        cfgDir.mkdirs()
        new File(cfgDir, 'urbex.json').text = """\
{
  "experimentalMultiWorldStyles": ${experimental},
  "dimensionsWithPresets": ["minecraft:overworld=urbex:default@${styles}"]
}
"""
    }
}

tasks.matching { it.name == 'runMixCheck' }.configureEach {
    dependsOn 'prepareMixCheck'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Plain `implementation`, not `modImplementation`: Loom 1.17.17 does not define the mod*
    // configurations at all (the call fails with "Could not find method modImplementation()"), and
    // it needs neither here - fabric-loader and fabric-api are published against the same mappings
    // this build compiles in, so there is nothing to remap.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Validates docs/schema/preset.schema.json (draft 2020-12) against the shipped presets and
    // guards it against drifting from the section codecs' KEYS constants; see PresetSchemaTest.
    testImplementation 'com.networknt:json-schema-validator:1.5.6'
}

test {
    useJUnitPlatform()
    // Two tests read files under docs/ - DatapackGuideExamplesTest decodes every JSON example in
    // docs/datapacks.md and checks the error messages it quotes, PresetSchemaTest drift-guards
    // docs/schema/preset.schema.json against the section codecs - and docs/ is on no classpath, so
    // without declaring these Gradle leaves :test UP-TO-DATE after a documentation-only edit. That is
    // exactly the edit those two exist to catch. Listed file by file rather than as fileTree('docs'):
    // nothing reads docs/presets.md - its prose is unasserted, only the schema beside it is checked -
    // and the specs and plans under docs/superpowers/ change with every task, so a whole-directory
    // input would cost a full suite run per plan edit.
    inputs.files(files('docs/datapacks.md'), fileTree('docs/schema'))
            .withPropertyName('docsReadByTests')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    // MIT requires the notice in "all copies", and for a mod the distributed copy is the jar,
    // not this repository. Loom's remapJar takes this jar as its input, so the file carries
    // through to the artifact that actually ships.
    from(rootProject.file('LICENSE'))
}

processResources {
    def expandProps = [
            'version'              : version,
            'mod_id'               : mod_id,
            'mod_name'             : mod_name,
            'minecraft_version'    : minecraft_version,
            'fabric_loader_version': fabric_loader_version,
            'fabric_version'       : fabric_version,
            'java_version'         : java_version
    ]
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications.create('mavenJava', MavenPublication) {
        from components.java
        artifactId = "urbex"
        pom {
            name = 'Urbex'
            description = 'Procedural abandoned-city worldgen'
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                name = 'local'
                url = 'file://' + System.getenv('local_maven')
            }
        }
    }
}
