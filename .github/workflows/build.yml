name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: Worldgen digest check
        run: |
          ./gradlew runDigestCheck --no-daemon | tee digest-check.log
          grep -q "URBEX-DIGEST-CHECK: OK" digest-check.log
      - name: Worldgen digest check (features)
        run: |
          ./gradlew runDigestCheckFeatures --no-daemon | tee digest-check-features.log
          grep -q "URBEX-DIGEST-CHECK: OK" digest-check-features.log
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
